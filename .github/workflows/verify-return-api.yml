name: Verify disputed return API record
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-return-api.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.head_commit.message == 'Verify disputed return from Amazon API without alerts'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: pip install requests
      - name: Read original and current Amazon API records
        env:
          LWA_APP_ID: ${{ secrets.LWA_APP_ID }}
          LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
          SP_API_REFRESH_TOKEN: ${{ secrets.SP_API_REFRESH_TOKEN }}
          MARKETPLACE_ID: ${{ secrets.MARKETPLACE_ID }}
        run: |
          python - <<'PY'
          import csv, datetime as dt, gzip, hashlib, io, json, os, re, time
          import requests
          
          ENDPOINT = "https://sellingpartnerapi-na.amazon.com"
          TARGETS = {
              "43cb7fc110c1ed1e941f0ee52701763c3973a173a24172c352a212abfbfccc4b": "disputed_order",
              "8881ab17042b078c91282f726b3056014877e0d44a96d48b6acdc31d324c9073": "linked_original",
          }
          EXPECTED_COMMENT = "Expired|11/2025"
          def digest(value):
              return hashlib.sha256(value.encode()).hexdigest()
          def checked(response, operation):
              if not response.ok:
                  raise RuntimeError(f"{operation}: HTTP {response.status_code}")
              return response
          token = checked(requests.post(
              "https://api.amazon.com/auth/o2/token",
              data={"grant_type": "refresh_token", "refresh_token": os.environ["SP_API_REFRESH_TOKEN"],
                    "client_id": os.environ["LWA_APP_ID"], "client_secret": os.environ["LWA_CLIENT_SECRET"]},
              timeout=30), "token exchange").json()["access_token"]
          headers = {"x-amz-access-token": token, "Content-Type": "application/json"}
          def api_get(path):
              for attempt in range(4):
                  response = requests.get(ENDPOINT + path, headers=headers, timeout=30)
                  if response.status_code != 429:
                      return checked(response, path.split("?")[0].rsplit("/", 1)[0]).json()
                  time.sleep(3 * (attempt + 1))
              raise RuntimeError("API throttling after four attempts")
          def report_rows(report_id):
              for attempt in range(50):
                  meta = api_get(f"/reports/2021-06-30/reports/{report_id}")
                  state = meta.get("processingStatus")
                  if state == "DONE":
                      break
                  if state in ("FATAL", "CANCELLED"):
                      raise RuntimeError(f"Report status: {state}")
                  time.sleep(6)
              else:
                  raise RuntimeError("Report polling timed out")
              doc = api_get("/reports/2021-06-30/documents/" + meta["reportDocumentId"])
              raw = checked(requests.get(doc["url"], timeout=60), "report download").content
              if doc.get("compressionAlgorithm") == "GZIP":
                  raw = gzip.decompress(raw)
              try:
                  text = raw.decode("utf-8-sig")
              except UnicodeDecodeError:
                  text = raw.decode("cp1252")
              rows = list(csv.DictReader(io.StringIO(text), delimiter="\t"))
              print(json.dumps({"source": "Amazon SP-API", "report_id": report_id, "report_type": meta.get("reportType"),
                  "created_time": meta.get("createdTime"), "start": meta.get("dataStartTime"), "end": meta.get("dataEndTime"),
                  "status": state, "total_rows": len(rows)}))
              return rows
          
          order_ids = {}
          def inspect(rows, label):
              selected = [r for r in rows if digest(r.get("order-id", "").strip()) in TARGETS]
              print(json.dumps({"report_label": label, "matching_rows": len(selected)}))
              for row in selected:
                  order_id = row.get("order-id", "").strip()
                  target = TARGETS[digest(order_id)]
                  order_ids[target] = order_id
                  comment = row.get("customer-comments", "")
                  out = {"report_label": label, "target": target,
                      "reason": row.get("reason"), "return_date": row.get("return-date"),
                      "asin": row.get("asin"), "sku": row.get("sku"), "quantity": row.get("quantity"),
                      "fulfillment_center": row.get("fulfillment-center-id"),
                      "disposition": row.get("detailed-disposition"), "status": row.get("status"),
                      "comment_matches_disputed_text_exactly": comment == EXPECTED_COMMENT,
                      "comment_contains_expiry_word": bool(re.search(r"\bexpir\w*\b", comment, re.I)),
                      "comment_sha256": digest(comment), "comment_length": len(comment),
                      "unit_fingerprint": digest(row.get("license-plate-number", ""))[:16]}
                  if comment == EXPECTED_COMMENT:
                      out["customer_comments"] = EXPECTED_COMMENT
                  else:
                      out["customer_comments"] = "Omitted from public logs; exact-match result above"
                  print(json.dumps(out, sort_keys=True))
          
          try:
              inspect(report_rows("100995020763"), "original_alert_report")
          except RuntimeError as exc:
              print(json.dumps({"original_report_error": str(exc)}))
          
          now = dt.datetime.now(dt.timezone.utc)
          body = {"reportType": "GET_FBA_FULFILLMENT_CUSTOMER_RETURNS_DATA",
                  "marketplaceIds": [os.environ.get("MARKETPLACE_ID") or "ATVPDKIKX0DER"],
                  "dataStartTime": (now-dt.timedelta(days=45)).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "dataEndTime": now.strftime("%Y-%m-%dT%H:%M:%SZ")}
          new_report = checked(requests.post(ENDPOINT + "/reports/2021-06-30/reports",
              headers=headers, json=body, timeout=30), "fresh returns report").json()["reportId"]
          inspect(report_rows(new_report), "fresh_report")
          for target, order_id in order_ids.items():
              payload = api_get(f"/orders/v0/orders/{order_id}").get("payload", {})
              original = payload.get("ReplacedOrderId", "")
              print(json.dumps({"source": "Amazon Orders API", "target": target,
                  "purchase_date": payload.get("PurchaseDate"), "order_status": payload.get("OrderStatus"),
                  "fulfillment_channel": payload.get("FulfillmentChannel"),
                  "is_replacement_order": payload.get("IsReplacementOrder"),
                  "replaced_order_matches_linked_original": digest(original) in TARGETS and TARGETS[digest(original)] == "linked_original"}))
              time.sleep(2.2)
          print("Verification complete. No alerts sent, no inventory or order changes, no monitoring state written.")
          
          PY
