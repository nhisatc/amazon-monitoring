name: Amazon Buyer Message → Slack + Email

permissions:
  contents: write

on:
  schedule:
    # Every 5 minutes. GitHub's scheduler is best-effort and can drift under
    # load, so treat this as "within ~5-15 min" rather than exact.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Never let two runs overlap — both would read the same unprocessed mail and
# double-post before either had written state back.
concurrency:
  group: buyer-message-alert
  cancel-in-progress: false

jobs:
  check-buyer-messages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Check and post buyer messages
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS:   ${{ secrets.ALERT_RECIPIENTS }}
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID:   ${{ secrets.SLACK_CHANNEL_ID }}
        run: python buyer_message_slack.py --once

      - name: Commit state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto: buyer alert state updated"
          # Four workflows write to data/; rebase onto whatever landed first
          # rather than failing the run on a non-fast-forward push.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push race, retry $i"
            sleep 5
          done
          echo "Could not push state after 3 attempts" >&2
          exit 1
