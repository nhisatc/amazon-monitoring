name: Return Reason Monitor

permissions:
  contents: write

on:
  schedule:
    # Amazon's returns report lags the physical return by a few hours, so
    # polling faster than this buys nothing. 06:00, 12:00, 18:00, 00:00 UTC.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: returns-monitor
  cancel-in-progress: false

jobs:
  returns-monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run returns monitor
        env:
          LWA_APP_ID:           ${{ secrets.LWA_APP_ID }}
          LWA_CLIENT_SECRET:    ${{ secrets.LWA_CLIENT_SECRET }}
          SP_API_REFRESH_TOKEN: ${{ secrets.SP_API_REFRESH_TOKEN }}
          SELLER_ID:            ${{ secrets.SELLER_ID }}
          MARKETPLACE_ID:       ${{ secrets.MARKETPLACE_ID }}
          GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS:     ${{ secrets.ALERT_RECIPIENTS }}
          SLACK_BOT_TOKEN:      ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID:     ${{ secrets.SLACK_CHANNEL_ID }}
        run: python returns_monitor.py

      - name: Commit state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto: returns monitor state updated"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push race, retry $i"
            sleep 5
          done
          echo "Could not push state after 3 attempts" >&2
          exit 1
